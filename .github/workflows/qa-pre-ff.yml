name: Manual pre-FF verification
run-name: Pre-FF verification ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repository branch or commit SHA to verify
        required: true
        default: codex/unified-v2-source
        type: string
      job:
        description: Optional one-based job index for diagnosis; empty runs all 213 jobs
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pre-ff-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  parser-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.target.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate census target ref without echoing untrusted input
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo 'Invalid repository ref'; exit 1; }
      - name: Check out reviewed parser census
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - name: Check out target parser inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - name: Freeze the exact census checkout
        id: target
        run: |
          sha=$(git -C source rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid census checkout SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare native DOM fingerprints before full verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          python -m pip install --disable-pip-version-check -r source/requirements-army-books.txt > "$RUNNER_TEMP/parser-install.log" 2>&1
          python -B orchestration/tools/parser-dom-census.py --source="$GITHUB_WORKSPACE/source" --out="$RUNNER_TEMP/parser-census-report"
      - name: Upload parser census metadata only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: parser-dom-census-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/parser-census-report/RESULTS.json
            ${{ runner.temp }}/parser-census-report/INVENTORY.csv
  pre-ff:
    needs: parser-census
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      QA_SKIP_TMP_SWEEP: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate target ref without echoing untrusted input
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          echo "QA_TMP_ROOT=$RUNNER_TEMP/qa-work" >> "$GITHUB_ENV"
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo 'Invalid repository ref'; exit 1; }
      - name: Check out reviewed orchestration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - name: Check out target with historical baselines
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.parser-census.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare locked dependencies and controls
        timeout-minutes: 15
        working-directory: source
        run: |
          echo 'Installing locked npm dependencies'
          npm ci > "$RUNNER_TEMP/npm-install.log" 2>&1
          echo 'Installing declared Python dependencies'
          python -m pip install --disable-pip-version-check -r requirements-army-books.txt > "$RUNNER_TEMP/python-install.log" 2>&1
          python -c 'import json,sys,lxml.etree as e; print("QA_PARSER_VERSIONS "+json.dumps({"python":sys.version.split()[0],"LXML_VERSION":e.LXML_VERSION,"LIBXML_VERSION":e.LIBXML_VERSION,"LIBXML_COMPILED_VERSION":e.LIBXML_COMPILED_VERSION}))'
          echo 'Checking parser-independent CSM source fingerprints and unchanged generated bytes'
          python -B ../orchestration/tests/parser-independent-source-qa.py > "$RUNNER_TEMP/parser-controls.log" 2>&1
          echo 'Installing locked Playwright Chromium and system dependencies'
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1
          echo 'Checking workflow and public-report controls'
          node ../orchestration/tests/qa-pre-ff-ci-qa.mjs > "$RUNNER_TEMP/ci-controls.log" 2>&1
          node ../orchestration/tests/ci-bsdata-transport-qa.mjs > "$RUNNER_TEMP/bsdata-controls.log" 2>&1
          node ../orchestration/tests/qa-job-policy-qa.mjs > "$RUNNER_TEMP/job-policy-controls.log" 2>&1
          node ../orchestration/tests/qa-ci-progress-qa.mjs > "$RUNNER_TEMP/progress-controls.log" 2>&1
          node ../orchestration/tests/browser-phase-controls-qa.mjs > "$RUNNER_TEMP/browser-phase-controls.log" 2>&1
          node tests/book-update-dependency-ignore-qa.mjs > "$RUNNER_TEMP/dependency-ignore-controls.log" 2>&1
          echo "QA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          node -e 'const p=require("playwright").chromium.executablePath();for(const k of ["WH_PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH","PLAYWRIGHT_CHROMIUM_EXECUTABLE"])console.log(k+"="+p)' >> "$GITHUB_ENV"
      - name: Prepare authenticated BSData from private mirror
        timeout-minutes: 5
        working-directory: source
        env:
          BSDATA_MIRROR_SSH_KEY: ${{ secrets.BSDATA_MIRROR_SSH_KEY }}
        run: |
          node ../orchestration/tools/prepare-ci-bsdata.mjs --source="$PWD" > "$RUNNER_TEMP/bsdata-prepare.log" 2>&1
      - name: Run complete sequential pre-FF
        id: queue
        timeout-minutes: 280
        working-directory: source
        env:
          DIAGNOSTIC_JOB: ${{ inputs.job }}
        run: |
          # Raw test output may contain source captures or private failure values.
          # Keep it runner-local; publish only the fixed-schema report below.
          [[ -z "$DIAGNOSTIC_JOB" || "$DIAGNOSTIC_JOB" =~ ^[1-9][0-9]*$ && "$DIAGNOSTIC_JOB" -le 213 ]] || { echo 'Invalid diagnostic job index'; exit 1; }
          queue_args=(--ci-timeout-policy=tools/qa-pre-ff-timeouts.json --progress-file="$RUNNER_TEMP/pre-ff-progress.jsonl")
          progress_args=()
          if [[ -n "$DIAGNOSTIC_JOB" ]]; then queue_args+=(--job="$DIAGNOSTIC_JOB"); progress_args+=(--job="$DIAGNOSTIC_JOB"); fi
          set +e
          node ../orchestration/tools/qa-ci-progress.mjs --source="$PWD" --events="$RUNNER_TEMP/pre-ff-progress.jsonl" "${progress_args[@]}" &
          progress_pid=$!
          for attempt in {1..100}; do [[ -f "$RUNNER_TEMP/pre-ff-progress.jsonl.ready" ]] && break; sleep 0.1; done
          [[ -f "$RUNNER_TEMP/pre-ff-progress.jsonl.ready" ]] || { kill -TERM "$progress_pid" 2>/dev/null; exit 1; }
          npm run qa:pre-ff -- --out="$RUNNER_TEMP/pre-ff-raw" "${queue_args[@]}" > "$RUNNER_TEMP/pre-ff-console.log" 2>&1 &
          queue_pid=$!
          wait "$queue_pid"
          queue_code=$?
          kill -TERM "$progress_pid" 2>/dev/null
          wait "$progress_pid"
          progress_code=$?
          if [[ "$progress_code" -ne 0 ]]; then exit 1; fi
          exit "$queue_code"
      - name: Export safe report and step summary
        if: ${{ always() }}
        env:
          QUEUE_OUTCOME: ${{ steps.queue.outcome }}
          DIAGNOSTIC_JOB: ${{ inputs.job }}
        run: |
          node orchestration/tools/qa-pre-ff-ci.mjs report --source="$GITHUB_WORKSPACE/source" --raw="$RUNNER_TEMP/pre-ff-raw" --out="$RUNNER_TEMP/pre-ff-report" --summary="$GITHUB_STEP_SUMMARY" --outcome="$QUEUE_OUTCOME" --job="$DIAGNOSTIC_JOB"
      - name: Upload report only, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pre-ff-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pre-ff-report/REPORT.md
            ${{ runner.temp }}/pre-ff-report/RESULTS.json
            ${{ runner.temp }}/pre-ff-report/JOB_PLAN.json
