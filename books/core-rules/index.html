<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1011">
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="description" content="Interactive Warhammer 40,000 Core Rules prototype.">
  <title>Core Rules — Prototype</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/navigation.css">
  <link rel="stylesheet" href="styles/content.css">
  <link rel="stylesheet" href="styles/popups.css">
</head>
<body>
  <header class="app-header" id="appHeader">
    <button class="icon-button menu-button" id="navMenu" type="button" aria-label="Open contents" aria-controls="tocPanel" aria-expanded="false">☰</button>
    <a class="library-link" href="../../index.html" aria-label="Return to library"><span>←</span><b>Library</b></a>
    <a class="brand" href="#cover" data-header-home>
      <span class="brand-mark" aria-hidden="true">CR</span>
      <span>Core Rules <small>11th edition // prototype</small></span>
    </a>
    <div class="header-actions">
      <button class="back-button" id="backButton" type="button" hidden><span>←</span> Back</button>
      <span class="edition-status"><i></i> RULESET // ACTIVE</span>
      <button class="icon-button" id="themeButton" type="button" aria-label="Use light theme">☼</button>
    </div>
  </header>

  <aside class="toc-panel" id="tocPanel" aria-label="Contents">
    <div class="toc-head">
      <div><span class="micro-label">FIELD MANUAL // INDEX</span><strong>Contents</strong></div>
      <button class="toc-collapse" id="navCollapse" type="button" aria-label="Collapse contents" aria-expanded="true">◀</button>
    </div>
    <label class="toc-search" for="navSearch"><span aria-hidden="true">⌕</span><input id="navSearch" type="search" placeholder="Find a section…" autocomplete="off"></label>
    <nav class="toc-tree" id="tocTree"></nav>
    <div class="toc-meta"><span>SOURCE</span><strong>PDF</strong><span>LANGUAGE</span><strong>EN</strong><span>STATUS</span><strong>ORIGINAL</strong></div>
  </aside>
  <button class="toc-scrim" id="tocScrim" type="button" aria-label="Close contents" aria-hidden="true"></button>

  <main class="main" id="main">
    <div class="reader-tools" id="readerTools">
      <label for="globalSearch"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" placeholder="Search rules and terms…" autocomplete="off"></label>
      <button id="searchClear" type="button" hidden>Clear</button>
      <span class="reader-status" id="readerStatus">ORIGINAL PDF SOURCE</span>
    </div>
    <section class="search-results" id="searchResults" hidden aria-live="polite"></section>
    <article class="rules-document" id="rulesDocument"></article>
    <noscript>JavaScript is required for the interactive prototype.</noscript>
  </main>

  <div class="popup-layer" id="popupLayer" aria-live="polite"></div>

  <script src="content/core-rules.source.en.js"></script>
  <script src="content/core-rules.en.js"></script>
  <script src="scripts/renderer.js"></script>
  <script src="scripts/navigation-controller.js"></script>
  <script src="scripts/popup-controller.js"></script>
  <script src="scripts/journey-controller.js"></script>
  <script src="scripts/ui-controllers.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
